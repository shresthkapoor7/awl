name: Checks
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      AWL_AI_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prepare Linux desktop
        if: runner.os == 'Linux'
        run: |
          node -e 'require("electron")'
          npx playwright-core install-deps chromium
          sudo apt-get install -y openbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Check types and build
        run: npm run build
      - name: Unit and integration checks (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' bash -c '
            openbox >/tmp/awl-window-manager.log 2>&1 &
            awl_wm_pid=$!
            trap "kill $awl_wm_pid 2>/dev/null || true" EXIT
            npm run test:all
          '

      - name: Unit and integration checks (macOS)
        if: runner.os == 'macOS'
        run: npm run test:all
      - name: Test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
